<!DOCTYPE html>
<html>
<head>
<title>HEDGE FUND AI</title>
<style>
body{background:#0b0f1a;color:white;font-family:Arial}
.card{background:#1b2235;margin:10px;padding:10px;border-radius:10px}
</style>
</head>
<body>

<h2>🏦 HEDGE FUND DASHBOARD</h2>

<select id="m" onchange="load()">
<option value="forex">Forex</option>
<option value="crypto">Crypto</option>
<option value="gold">Gold</option>
</select>

<div id="out"></div>

<script>

async function load(){

let m = document.getElementById("m").value;

let r = await fetch("/api/signals?market="+m);
let d = await r.json();

let box = document.getElementById("out");
box.innerHTML = "";

d.forEach(x=>{
box.innerHTML += `
<div class="card">
<b>${x.direction}</b><br>
${x.pair}<br>
🔥 ${x.probability}%
</div>
`;
});

}

load();
setInterval(load,5000);

</script>

</body>
</html>
